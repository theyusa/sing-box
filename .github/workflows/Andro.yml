name: Build Android (?)

on:
  workflow_dispatch:
    inputs:
      android_client_branch:
        description: "Android client branch (dev or test)"
        required: false
        type: choice
        default: "dev"
        options:
          - dev
          - test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================================
# SLIM BUILD CONFIGURATION
# ============================================================================
env:
  SLIM_TAGS: "with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0"
  SLIM_TAGS_NAIVE: "with_gvisor,with_quic,with_utls,with_clash_api,with_naive_outbound,badlinkname,tfogo_checklinkname0"

jobs:
  strategy_matrix:
    name: Determine Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Generate Version Matrix
        id: generate
        run: |
          set -euo pipefail
          
          # GitHub Actions run number kullan (her workflow Ã§alÄ±ÅŸtÄ±ÄŸÄ±nda 1 artar)
          RUN_NUM=${{ github.run_number }}
          
          # Versiyon oluÅŸtur: dev-v1.1, dev-v1.2, dev-v1.3...
          NEW_VERSION="dev-v1.${RUN_NUM}"
          
          echo "Generated version: $NEW_VERSION (based on run #${RUN_NUM})"
          
          # JSON oluÅŸtur
          VERSIONS_JSON=$(jq -n \
            --arg v "$NEW_VERSION" \
            '[{"version": $v, "prerelease": true}]')
          
          echo "Generated Matrix:"
          echo "$VERSIONS_JSON" | jq .
          
          # Set output
          echo "matrix=$(echo "$VERSIONS_JSON" | jq -c .)" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # ANDROID BUILD
  # ============================================================================
  build_android:
    name: Android (${{ matrix.config.version }})
    runs-on: ubuntu-latest
    needs: strategy_matrix
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.strategy_matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify directory structure
        run: |
          echo "=== Repository structure ==="
          ls -la
          echo ""
          echo "=== Checking required directories ==="
          
          # include klasÃ¶rÃ¼ kontrolÃ¼
          if [ -d "include" ]; then
            echo "âœ“ include directory exists"
            ls -la include/
          else
            echo "âœ— include directory NOT found!"
            exit 1
          fi
          
          # libbox kontrolÃ¼ (iki farklÄ± lokasyon)
          if [ -d "experimental/libbox" ]; then
            echo "âœ“ experimental/libbox exists"
          elif [ -d "cmd/libbox" ]; then
            echo "âœ“ cmd/libbox exists"
          else
            echo "âœ— libbox NOT found in expected locations!"
            echo "Available directories:"
            find . -maxdepth 2 -type d -name "*libbox*" || echo "No libbox directory found"
            exit 1
          fi
          
          # build_libbox tool kontrolÃ¼
          if [ -d "cmd/internal/build_libbox" ]; then
            echo "âœ“ cmd/internal/build_libbox exists"
          else
            echo "âœ— cmd/internal/build_libbox NOT found!"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with: 
          go-version: '1.23'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with: 
          ndk-version: r28
          add-to-path: false
          link-to-sdk: false
          local-cache: false

      - name: Install gomobile
        run: |
          echo "Installing gomobile..."
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          
          # gomobile init
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          
          # Verify installation
          which gomobile
          gomobile version

      - name: Build libbox.aar
        run: |-
          echo "Building libbox.aar..."
          
          # Add gomobile to PATH
          export PATH=$PATH:$(go env GOPATH)/bin
          
          # Build tags'i environment variable olarak ayarla
          export TAGS="$SLIM_TAGS"
          
          # build_libbox tool'unu Ã§alÄ±ÅŸtÄ±r (doÄŸru parametrelerle)
          go run ./cmd/internal/build_libbox -target android
          
          # Kontrol et - libbox.aar genellikle clients/android/app/libs/ altÄ±nda oluÅŸur
          echo "Searching for libbox.aar..."
          find . -name "libbox.aar" -type f
          
          if [ -f "libbox.aar" ]; then
            echo "âœ“ libbox.aar found in root"
            ls -lh libbox.aar
          elif [ -f "clients/android/app/libs/libbox.aar" ]; then
            echo "âœ“ libbox.aar found in clients/android/app/libs/"
            cp clients/android/app/libs/libbox.aar .
            ls -lh libbox.aar
          else
            echo "âœ— libbox.aar not found!"
            exit 1
          fi
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Checkout Android client
        uses: actions/checkout@v4
        with:
          repository: ElegaPhantom/sing-box-for-android
          ref: ${{ inputs.android_client_branch }}
          path: clients/android

      - name: Set version.properties
        run: |
          VERSION="${{ matrix.config.version }}"
          
          # Version code hesapla (timestamp based)
          VERSION_CODE=$(date +%Y%m%d%H)
          
          # version.properties oluÅŸtur
          mkdir -p clients/android
          echo "VERSION_CODE=${VERSION_CODE}" > clients/android/version.properties
          echo "VERSION_NAME=${VERSION}" >> clients/android/version.properties
          
          echo "Created version.properties:"
          cat clients/android/version.properties

      - name: Setup Keystore
        run: |-
          cd clients/android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          cat > local.properties << EOF
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME=${{ secrets.KEY_ALIAS }}
          ALIAS_PASS=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Patch Gradle (Arm64 Only)
        run: |-
          cd clients/android/app
          sed -i 's/include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/include("arm64-v8a")/' build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' build.gradle.kts

      - name: Build APK
        run: |-
          # libbox.aar'Ä± Android projesi iÃ§ine kopyala
          mkdir -p clients/android/app/libs
          cp libbox.aar clients/android/app/libs/
          cp libbox.aar clients/android/app/libs/libbox-legacy.aar
          
          # APK build et
          cd clients/android
          chmod +x ./gradlew
          ./gradlew :app:assembleOtherRelease --no-daemon
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Zulu_jdk/17.0.13-11/x64

      - name: Prepare Artifacts
        run: |-
          mkdir -p dist
          
          # APK'yÄ± bul ve kopyala
          find clients/android/app/build/outputs/apk/other/release -name "*.apk" -exec cp {} dist/ \;
          
          # Version metadata oluÅŸtur
          VERSION_CODE=$(grep VERSION_CODE clients/android/version.properties | cut -d= -f2)
          VERSION_NAME=$(grep VERSION_NAME clients/android/version.properties | cut -d= -f2)
          
          cat > dist/SFA-version-metadata.json << EOF
          {
            "version_code": ${VERSION_CODE},
            "version_name": "${VERSION_NAME}"
          }
          EOF
          
          # APK'yÄ± yeniden adlandÄ±r
          cd dist
          mv *.apk "sing-box-${{ matrix.config.version }}-android-arm64.apk"
          
          echo "Artifacts prepared:"
          ls -lh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-${{ matrix.config.version }}
          path: dist
          retention-days: 1

  # ============================================================================
  # CREATE RELEASES
  # ============================================================================
  release:
    name: Release ${{ matrix.config.version }}
    runs-on: ubuntu-latest
    needs: [strategy_matrix, build_android]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.strategy_matrix.outputs.matrix) }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "android-arm64-${{ matrix.config.version }}"
          merge-multiple: true

      - name: Prepare Release Files
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;
          
          echo "Release files:"
          ls -lh release_files/

      - name: Generate Changelog
        id: changelog
        run: |
          # Build date
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          # Changelog oluÅŸtur
          cat > changelog.md << 'EOF'
          ## ğŸ¯ Development Build #${{ github.run_number }}
          
          Custom slim build of sing-box for Android.
          
          ### ğŸ“¦ Downloads
          
          | Platform | Architecture | File |
          |----------|--------------|------|
          | Android | ARM64 | [`sing-box-${{ matrix.config.version }}-android-arm64.apk`](../../releases/download/${{ matrix.config.version }}/sing-box-${{ matrix.config.version }}-android-arm64.apk) |
          
          **Metadata**: [`SFA-version-metadata.json`](../../releases/download/${{ matrix.config.version }}/SFA-version-metadata.json)
          
          ---
          
          ## ğŸ”§ Slim Build Features
          
          ### âœ… Included
          - **Protocols**: VLESS (Reality), VMess, Trojan, Shadowsocks, Hysteria2
          - **Special**: NaiveProxy support
          - **Performance**: GVISOR, QUIC, uTLS, Clash API
          
          ### âŒ Removed (to reduce size)
          - Tor, SSH, ShadowTLS, AnyTLS
          - TUIC, Hysteria v1
          - WireGuard, Tailscale
          
          ---
          
          ## ğŸ“Š Build Information
          
          | Item | Value |
          |------|-------|
          | **Build Date** | ${BUILD_DATE} |
          | **Build Number** | #${{ github.run_number }} |
          | **Android NDK** | r28 |
          | **Go Version** | 1.23 |
          | **Min Android API** | 23 (Android 6.0+) |
          
          ---
          
          ## ğŸš€ Installation
          
          1. Download the APK file above
          2. Enable "Install from Unknown Sources" in Android settings
          3. Install the APK
          4. Grant necessary permissions
          
          ## âš ï¸ Notes
          
          - **ARM64 only** - will not work on 32-bit devices
          - This is a custom slim build optimized for size and performance
          
          ---
          
          <sub>ğŸ¤– Auto-generated by [slim-build workflow](../../actions) on ${BUILD_DATE}</sub>
          EOF
          
          # DeÄŸiÅŸkenleri deÄŸiÅŸtir
          sed -i "s/\${BUILD_DATE}/${BUILD_DATE}/g" changelog.md
          
          # Output iÃ§in encode et
          {
            echo "changelog<<EOFMARKER"
            cat changelog.md
            echo "EOFMARKER"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.config.version }}
          name: "${{ matrix.config.version }} - Slim Build ğŸš€"
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ matrix.config.prerelease }}
          files: release_files/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
