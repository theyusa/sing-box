name: Build Android (?)

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: "Upstream branch/tag to build from"
        required: true
        type: string
        default: "main"
      android_client_branch:
        description: "Android client branch (dev or test)"
        required: false
        type: choice
        default: "dev"
        options:
          - dev
          - test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================================
# SLIM BUILD CONFIGURATION
# ============================================================================
env:
  SLIM_TAGS: "with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0"
  SLIM_TAGS_NAIVE: "with_gvisor,with_quic,with_utls,with_clash_api,with_naive_outbound,badlinkname,tfogo_checklinkname0"

jobs:
  strategy_matrix:
    name: Determine Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Generate Version Matrix
        id: generate
        run: |
          set -euo pipefail
          
          # GitHub Actions run number kullan (her workflow çalıştığında 1 artar)
          # İlk çalıştırma: 1, ikinci: 2, üçüncü: 3...
          RUN_NUM=${{ github.run_number }}
          
          # Versiyon oluştur: dev-v1.0, dev-v1.1, dev-v1.2...
          NEW_VERSION="dev-v1.${RUN_NUM}"
          
          echo "Generated version: $NEW_VERSION (based on run #${RUN_NUM})"
          
          # JSON oluştur
          VERSIONS_JSON=$(jq -n \
            --arg v "$NEW_VERSION" \
            --arg t "${{ inputs.upstream_branch }}" \
            '[{"version": $v, "tag": $t, "prerelease": true}]')
          
          echo "Generated Matrix:"
          echo "$VERSIONS_JSON" | jq .
          
          # Set output
          echo "matrix=$(echo "$VERSIONS_JSON" | jq -c .)" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # ANDROID BUILD
  # ============================================================================
  build_android:
    name: Android (${{ matrix.config.version }})
    runs-on: ubuntu-latest
    needs: strategy_matrix
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.strategy_matrix.outputs.matrix) }}
    steps:
      - name: Checkout custom
        uses: actions/checkout@v4
        with: { path: custom }

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: TheYusa/sing-box
          ref: ${{ matrix.config.tag }}
          fetch-depth: 0
          path: sing-box

      - name: Verify directory structure
        run: |
          echo "=== Checking sing-box directory structure ==="
          ls -la sing-box/
          echo ""
          echo "=== Checking if cmd directory exists ==="
          if [ -d "sing-box/cmd" ]; then
            echo "✓ cmd directory exists"
            ls -la sing-box/cmd/
          else
            echo "✗ cmd directory NOT found!"
          fi
          echo ""
          echo "=== Checking if cmd/libbox exists ==="
          if [ -d "sing-box/cmd/libbox" ]; then
            echo "✓ cmd/libbox directory exists"
            ls -la sing-box/cmd/libbox/
          else
            echo "✗ cmd/libbox directory NOT found!"
          fi

      - name: Apply slim modifications
        run: |
          # İlk önce dizinlerin var olduğunu kontrol et
          if [ ! -d "sing-box/include" ]; then
            echo "ERROR: sing-box/include directory not found!"
            exit 1
          fi
          
          cp custom/include/registry.go sing-box/include/registry.go
          cp custom/include/quic.go sing-box/include/quic.go
          cp custom/include/quic_stub.go sing-box/include/quic_stub.go
          
          echo "Slim modifications applied successfully"

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: ^1.25.5 }

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r28, add-to-path: false }

      - name: Build box
        working-directory: sing-box
        run: |-
          # Dizin kontrolü
          if [ ! -d "cmd/libbox" ]; then
            echo "ERROR: cmd/libbox directory not found!"
            echo "Current directory: $(pwd)"
            echo "Directory contents:"
            find . -maxdepth 3 -type d
            exit 1
          fi
          
          export CGO_ENABLED=1
          export GOOS=android
          go build -v -trimpath -tags "$SLIM_TAGS" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${{ matrix.config.version }} -s -w -buildid=" \
            -o libbox.so ./cmd/libbox
          ls -lh libbox.so

      - name: Build box (Naive)
        working-directory: sing-box
        run: |-
          export CGO_ENABLED=1
          export GOOS=android
          go build -v -trimpath -tags "$SLIM_TAGS_NAIVE" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${{ matrix.config.version }} -s -w -buildid=" \
            -o libbox-naive.so ./cmd/libbox
          ls -lh libbox-naive.so

      - name: Build libbox.aar
        working-directory: sing-box
        run: |-
          # cmd/internal/build_libbox kontrolü
          if [ ! -d "cmd/internal/build_libbox" ]; then
            echo "ERROR: cmd/internal/build_libbox not found!"
            exit 1
          fi
          
          mkdir -p clients/android/app/libs
          go run ./cmd/internal/build_libbox -o libbox.aar -t "$SLIM_TAGS"
          ls -lh libbox.aar

      - name: Checkout Android client
        uses: actions/checkout@v4
        with:
          repository: ElegaPhantom/sing-box-for-android
          ref: ${{ inputs.android_client_branch }}
          path: sing-box/clients/android

      - name: Set version.properties
        working-directory: sing-box
        run: |
          VERSION="${{ matrix.config.version }}"
          
          # Version code hesapla (timestamp based)
          VERSION_CODE=$(date +%Y%m%d%H)
          
          # Check if version.properties already exists
          if [ ! -f clients/android/version.properties ]; then
            echo "VERSION_CODE=${VERSION_CODE}" > clients/android/version.properties
            echo "VERSION_NAME=${VERSION}" >> clients/android/version.properties
          fi
          
          cat clients/android/version.properties

      - name: Setup Keystore
        working-directory: sing-box
        run: |-
          cd clients/android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          cat > local.properties << EOF
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME=${{ secrets.KEY_ALIAS }}
          ALIAS_PASS=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Patch Gradle (Arm64 Only)
        working-directory: sing-box
        run: |-
          cd clients/android/app
          sed -i 's/include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/include("arm64-v8a")/' build.gradle.kts
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' build.gradle.kts

      - name: Build APK
        working-directory: sing-box
        run: |-
          mkdir -p clients/android/app/libs
          cp libbox.aar clients/android/app/libs/
          cp libbox.aar clients/android/app/libs/libbox-legacy.aar
          cd clients/android
          ./gradlew :app:assembleOtherRelease --no-daemon
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Prepare Artifacts
        run: |-
          mkdir -p dist
          find sing-box/clients/android/app/build/outputs/apk/other/release -name "*.apk" -exec cp {} dist/ \;
          
          # Generate version metadata for updater
          VERSION_CODE=$(grep VERSION_CODE sing-box/clients/android/version.properties | cut -d= -f2)
          VERSION_NAME=$(grep VERSION_NAME sing-box/clients/android/version.properties | cut -d= -f2)
          cat > dist/SFA-version-metadata.json << EOF
          {
            "version_code": ${VERSION_CODE},
            "version_name": "${VERSION_NAME}"
          }
          EOF
          
          cd dist
          mv *.apk "sing-box-${{ matrix.config.version }}-android-arm64.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-${{ matrix.config.version }}
          path: dist
          retention-days: 1

  # ============================================================================
  # CREATE RELEASES
  # ============================================================================
  release:
    name: Release ${{ matrix.config.version }}
    runs-on: ubuntu-latest
    needs: [strategy_matrix, build_android]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.strategy_matrix.outputs.matrix) }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "android-arm64-${{ matrix.config.version }}"
          merge-multiple: true

      - name: Prepare Release Files
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Generate Changelog
        id: changelog
        run: |
          # Build date
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          # Upstream tag/branch
          UPSTREAM_REF="${{ matrix.config.tag }}"
          
          # Changelog oluştur
          cat > changelog.md << EOF
          ## 🎯 Development Build #${{ github.run_number }}
          
          This is a **custom slim build** based on TheYusa/sing-box @ \`${UPSTREAM_REF}\`.
          
          ### 📦 Downloads
          
          | Platform | Architecture | File |
          |----------|--------------|------|
          | Android | ARM64 | [\`sing-box-${{ matrix.config.version }}-android-arm64.apk\`](../../releases/download/${{ matrix.config.version }}/sing-box-${{ matrix.config.version }}-android-arm64.apk) |
          
          **Metadata**: [\`SFA-version-metadata.json\`](../../releases/download/${{ matrix.config.version }}/SFA-version-metadata.json)
          
          ---
          
          ## 🔧 Slim Build Features
          
          ### ✅ Included
          - **Protocols**: VLESS (Reality), VMess, Trojan, Shadowsocks, Hysteria2
          - **Special**: NaiveProxy support
          - **Performance**: GVISOR, QUIC, uTLS, Clash API
          
          ### ❌ Removed
          - Tor, SSH, ShadowTLS, AnyTLS
          - TUIC, Hysteria v1
          - WireGuard, Tailscale
          
          ---
          
          ## 📊 Build Information
          
          | Item | Value |
          |------|-------|
          | **Build Date** | ${BUILD_DATE} |
          | **Build Number** | #${{ github.run_number }} |
          | **Upstream Ref** | ${UPSTREAM_REF} |
          | **Android NDK** | r28 |
          | **Go Version** | 1.25.5 |
          | **Min Android API** | 23 (Android 6.0+) |
          
          ---
          
          ## 🚀 Installation
          
          1. Download the APK file above
          2. Enable "Install from Unknown Sources" in Android settings
          3. Install the APK
          4. Grant necessary permissions
          
          ## ⚠️ Notes
          
          - ARM64 only - will not work on 32-bit devices
          - Based on [TheYusa/sing-box](https://github.com/TheYusa/sing-box)
          
          ---
          
          <sub>🤖 Auto-generated by [slim-build workflow](../../actions) on ${BUILD_DATE}</sub>
          EOF
          
          # Output için encode et
          {
            echo "changelog<<EOF"
            cat changelog.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.config.version }}
          name: "${{ matrix.config.version }} - Slim Build 🚀"
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ matrix.config.prerelease }}
          files: release_files/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
